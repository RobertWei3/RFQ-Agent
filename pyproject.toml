[project]
name = "rfq-agent"
version = "0.1.0"
description = "Multi-agent RFQ pricing pipeline built with LangGraph (learning reproduction)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-deepseek>=1.1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "mcp[cli]>=1.24,<2",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
rfq = "rfq_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Agent subgraphs pin durability on purpose (agents/common.py run_row).
filterwarnings = ["ignore:`durability` has no effect when no checkpointer:UserWarning"]

[tool.uv]
default-groups = ["dev", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"
# User-owned independent audit script; keep it exactly as written.
extend-exclude = ["tests/audit_p1.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dashboard = [
    "streamlit>=1.65.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]
